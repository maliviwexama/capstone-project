<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Feedback | UFH</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<div th:replace="~{fragments :: nav}"></div>
<div class="page-header"><div><span class="eyebrow">SERVICE FEEDBACK</span><h1>Give Feedback</h1><p>Tell us how your maintenance request was handled.</p></div></div>
<div class="card form-card">
<p class="error" th:if="${error}" th:text="${error}"></p>
<form method="post" action="/feedback" class="standard-form">
<input type="hidden" name="complaintId" th:value="${complaint.id}">
<label>Request</label><p class="muted" th:text="${complaint.description}"></p>
<label>Rating</label>
<div class="rating-options" role="radiogroup" aria-label="Service rating">
  <label th:each="n : ${#numbers.sequence(1,5)}" class="rating-option"><input type="radio" name="rating" th:value="${n}" required><span th:text="${n}"></span><small th:text="${n == 1 ? 'Poor' : (n == 5 ? 'Excellent' : '')}"></small></label>
</div>
<label>Comment (optional)</label><textarea name="comment" rows="6" maxlength="2000" placeholder="Tell us what went well or what should improve."></textarea>
<button type="submit">Submit Feedback</button>
</form>
</div>
</body>
</html>
