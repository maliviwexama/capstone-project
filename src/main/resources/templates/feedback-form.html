<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Leave Feedback</title>
    <link rel="stylesheet" href="/css/style.css">

    <style>
        .feedback-container {
            width: 500px;
            margin: 40px auto;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #f9f9f9;
        }

        .stars {
            display: flex;
            flex-direction: row-reverse;
            justify-content: flex-end;
            gap: 5px;
            margin: 15px 0;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 35px;
            color: #ccc;
            cursor: pointer;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: gold;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="feedback-container">

    <h1>Leave Feedback</h1>

    <p>
        <strong>Maintenance Request:</strong>
        <span th:text="${complaint.description}"></span>
    </p>

    <form method="post" action="/feedback">

        <input type="hidden"
               name="complaintId"
               th:value="${complaint.id}">

        <label><strong>How would you rate the service? <span class="muted">(optional)</span></strong></label>

        <div class="stars">

            <input type="radio" id="star5" name="rating" value="5">
            <label for="star5">★</label>

            <input type="radio" id="star4" name="rating" value="4">
            <label for="star4">★</label>

            <input type="radio" id="star3" name="rating" value="3">
            <label for="star3">★</label>

            <input type="radio" id="star2" name="rating" value="2">
            <label for="star2">★</label>

            <input type="radio" id="star1" name="rating" value="1">
            <label for="star1">★</label>

        </div>

        <label for="comment"><strong>Comment</strong> <span class="muted">(you can submit a comment without a rating)</span></label>

        <br><br>

        <textarea id="comment"
                  name="comment"
                  placeholder="Tell us about your experience..."></textarea>

        <br>

        <button type="submit">Submit Feedback</button>

    </form>

    <p>
        <a href="/my-requests">← Back to My Requests</a>
    </p>

</div>

</body>
</html>
