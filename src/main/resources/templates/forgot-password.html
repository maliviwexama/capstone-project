<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Password | UFH</title><link rel="stylesheet" href="/css/style.css"></head>
<body class="auth-page cinematic-auth-page">
<div class="auth-container">
  <div class="auth-brand"><div class="logo-placeholder"><img src="/images/ufh-logo.png" alt="University of Fort Hare Logo"></div><h1>Reset Password</h1><p>UFH Residence Maintenance</p></div>
  <div class="auth-card">
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="success-message" th:if="${success}" th:text="${success}"></p>
    <p>Verify your registered email and student number or Staff ID before choosing a new password.</p>
    <div class="security-note">For security, only 3 unsuccessful recovery attempts are allowed within a 30-minute window.</div>
    <form method="post" action="/forgot-password">
      <div class="form-group"><label>Email</label><input type="email" name="email" autocomplete="email" required></div>
      <div class="form-group"><label>Student number or Staff ID</label><input type="text" name="identifier" maxlength="9" placeholder="Student number or UFH/123" required></div>
      <div class="form-group"><label>New password</label><input type="password" name="newPassword" minlength="8" autocomplete="new-password" required></div>
      <div class="form-group"><label>Confirm new password</label><input type="password" name="confirmPassword" minlength="8" autocomplete="new-password" required></div>
      <button type="submit" class="primary-button">Reset Password</button>
    </form>
    <div class="auth-footer"><a href="/login">Back to Login</a></div>
  </div>
</div>
</body>
</html>
