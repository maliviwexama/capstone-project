<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Reset Password | UFH</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth-page"><div class="auth-container"><div class="auth-brand"><div class="logo-placeholder"><img src="/images/ufh-logo.png" alt="University of Fort Hare Logo"></div><h1>Reset Password</h1><p>UFH Residence Maintenance</p></div><div class="auth-card"><p class="error" th:if="${error}" th:text="${error}"></p><p>For this MVP, verify the account using the registered email and your student number or Staff ID.</p><form method="post" action="/forgot-password"><div class="form-group"><label>Email</label><input type="email" name="email" required></div><div class="form-group"><label>Student number (students)</label><input type="text" name="studentNumber" pattern="[0-9]{9}" maxlength="9"></div><div class="form-group"><label>Staff ID (staff)</label><input type="text" name="staffId" pattern="UFH/[0-9]{3}" maxlength="7" placeholder="UFH/123"></div><div class="form-group"><label>New password</label><input type="password" name="newPassword" minlength="8" required></div><div class="form-group"><label>Confirm new password</label><input type="password" name="confirmPassword" minlength="8" required></div><button type="submit" class="primary-button">Reset Password</button></form><div class="auth-footer"><a href="/login">Back to Login</a></div></div></div></body></html>
