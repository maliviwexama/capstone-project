<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Change Password | UFH</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><div class="card form-card" style="margin:30px auto"><h1>Change Password</h1><p>Update your password while signed in.</p><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" action="/change-password" class="standard-form"><label>Current password</label><input type="password" name="currentPassword" required><label>New password</label><input type="password" name="newPassword" minlength="8" required><label>Confirm new password</label><input type="password" name="confirmPassword" minlength="8" required><button type="submit">Update Password</button></form></div></body></html>
