<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | UFH</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<!-- ADMIN NAVIGATION -->
<div th:if="${user.userType.name() == 'ADMIN'}">
  <div th:replace="~{admin-fragments :: adminNav}"></div>
</div>

<!-- STUDENT / STAFF NAVIGATION -->
<div th:if="${user.userType.name() != 'ADMIN'}">
  <div th:replace="~{fragments :: nav}"></div>
</div>


<!-- CHANGE PASSWORD CONTENT -->
<div class="card form-card password-card">

  <img
          class="page-illustration"
          src="/images/illustrations/verification.svg"
          alt="Password security illustration">

  <h1>Change Password</h1>

  <p>Update your password while signed in.</p>

  <p
          class="error"
          th:if="${error}"
          th:text="${error}">
  </p>

  <form
          method="post"
          action="/change-password"
          class="standard-form">

    <label for="currentPassword">Current password</label>

    <input
            id="currentPassword"
            type="password"
            name="currentPassword"
            autocomplete="current-password"
            required>


    <label for="newPassword">New password</label>

    <input
            id="newPassword"
            type="password"
            name="newPassword"
            minlength="8"
            autocomplete="new-password"
            required>


    <label for="confirmPassword">Confirm new password</label>

    <input
            id="confirmPassword"
            type="password"
            name="confirmPassword"
            minlength="8"
            autocomplete="new-password"
            required>


    <button type="submit">
      Update Password
    </button>

  </form>

</div>

</body>
</html>
